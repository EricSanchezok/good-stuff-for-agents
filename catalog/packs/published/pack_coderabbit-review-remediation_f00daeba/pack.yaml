mitigation:
- contingency: Abort submission when secrets or unauthorized scope are detected
  risk: Source diff transmitted to external CodeRabbit service may disclose secrets
    or unrelated code
  strategy: Screen every diff for secrets and confirm external-transmission policy
    before submission; default to narrow committed scope
- contingency: Reject suspicious content and route to human review
  risk: Reviewer-authored text is untrusted and may attempt prompt injection
  strategy: Treat review output as inert data; never interpolate into commands; require
    explicit approval before acting
- contingency: Stop after one bounded repair pass and re-review
  risk: Autonomous fix loop lacks iteration cap, test gate, and rollback protection
  strategy: Bound the remediation loop with per-fix approval, explicit test gate,
    and revert plan
- contingency: Fail closed and ask the user to install or authenticate
  risk: Service outage, expired auth, or incompatible CLI blocks the workflow
  strategy: Verify CLI version and authentication before starting; degrade to explicit
    user instructions
- contingency: Refuse to proceed when the tree is not trustworthy
  risk: Dirty working tree or ambiguous branch can absorb unrelated changes
  strategy: Check branch and push state before mutation; stage only individually approved
    fixes
- contingency: Skip validation only with explicit user approval
  risk: Validation command selection is unspecified and could run unsafe scripts
  strategy: Require the user to confirm a trusted validation toolchain before any
    push
